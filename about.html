            font-size: 2.2rem;
            padding: 8px 16px;
            cursor: pointer;
            line-height: 1;

            margin-top: 32px;

            justify-content: center;
            border: 4px solid #ffffff;
            padding: 48px;
            transform: rotate(1deg) skew(-1deg);
            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute;
            top: -20px; left: -20px;
            width: 120%; height: 120%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 30px,
                rgba(255,255,255,0.03) 30px,

            pointer-events: none;

            text-shadow: 8px 8px 0 #ff3b00;
            border: 6px solid #ff3b00;
            padding: 24px 48px;
            background: #000000;
            transform: rotate(-2deg);
            line-height: 1;

            gap: 16px;

        }
        .review-text {

            font-size: 1.2rem;
            color: #cccccc;
            line-height: 1.6;
        }

        .data-section {
            border: 4px solid #ff3b00;
            padding: 64px;
            background: #000000;
            display: flex;
            flex-direction: column;
            gap: 32px;
            transform: skew(-1deg);

        .data-section h2 {
            font-size: 3rem;
            color: #ffffff;
            border-bottom: 4px solid #ff3b00;
            padding-bottom: 16px;

            text-align: center;

        }
        .stat-number {

            color: #ff3b00;
            line-height: 1;
        }
        .stat-label {
            font-size: 1.2rem;
            color: #ffffff;
            margin-top: 8px;
            font-family: system-ui, sans-serif;
        }
        .data-section blockquote {
            font-size: 1.6rem;
            color: #ffffff;
            border-left: 8px solid #ff3b00;
            padding-left: 24px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .data-section { padding: 24px; }
            .data-stats { flex-direction: column; gap: 24px; }
            .stat-item { padding: 16px 24px; }
            .stat-number { font-size: 3rem; }
        }

        /* Footer */
        footer {
            border-top: 4px solid #ff3b00;
            padding-top: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            font-family: system-ui, sans-serif;
        }
        footer a {
            color: #ff3b00;
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }
        footer a:hover { border-color: #ff3b00; }

        .full-bleed {
            margin-left: calc(50% - 50vw);
            margin-right: calc(50% - 50vw);
            padding-left: 72px;
            padding-right: 72px;
        }
        @media (max-width: 768px) {

        /* 2px max radius for small elements - brutalist */
        .brutal-border, .brutal-border-accent, .review-card, .info-card, .stat-item {
            border-radius: 2px;
        }
